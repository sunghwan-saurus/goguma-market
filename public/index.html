<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>고구마마켓</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #FFF6E8;
      color: #3D1A00;
    }

    header {
      position: sticky; top: 0; z-index: 10;
      background: #5C2D0E;
      border-bottom: 1px solid #3D1A00;
    }
    .header-inner {
      max-width: 480px; margin: 0 auto;
      padding: 12px 16px;
      display: flex; align-items: center; justify-content: space-between;
    }
    .logo { font-size: 18px; font-weight: 700; color: #FFD07B; text-decoration: none; }
    .register-btn {
      font-size: 13px; font-weight: 600;
      color: #fff; background: #C94E00;
      border: none; cursor: pointer;
      padding: 6px 12px; border-radius: 8px;
      text-decoration: none;
    }
    .register-btn:hover { background: #A33D00; }

    ul { max-width: 480px; margin: 0 auto; list-style: none; }
    li { border-bottom: 1px solid #FFE4BA; }
    li a {
      display: flex; gap: 16px; padding: 20px 16px;
      cursor: pointer; text-decoration: none;
      transition: background 0.15s;
    }
    li a:hover { background: #FFF0D6; }

    .thumb {
      width: 96px; height: 96px; border-radius: 16px;
      overflow: hidden; background: #FFE4BA; flex-shrink: 0;
    }
    .thumb img { width: 100%; height: 100%; object-fit: cover; }
    .thumb-empty {
      width: 100%; height: 100%;
      display: flex; align-items: center; justify-content: center;
      font-size: 32px;
    }

    .info { display: flex; flex-direction: column; justify-content: space-between; flex: 1; min-width: 0; }
    .title-row { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
    .badge {
      font-size: 11px; font-weight: 600; padding: 2px 6px; border-radius: 4px;
      flex-shrink: 0; color: #fff;
    }
    .badge-reserved { background: #7C3D00; }
    .badge-sold { background: #B8A090; }

    .title { font-size: 15px; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: #3D1A00; }
    .title-sold { color: #C4A882; text-decoration: line-through; }

    .meta { font-size: 12px; color: #A0704A; margin-top: 4px; }
    .price { font-size: 14px; font-weight: 700; color: #C94E00; }
    .price-sold { color: #C4A882; }

    .fab {
      position: fixed; bottom: 24px; right: 24px;
      width: 56px; height: 56px; border-radius: 50%;
      background: #C94E00; color: #fff;
      border: none; font-size: 28px; cursor: pointer;
      box-shadow: 0 4px 12px rgba(90, 30, 0, 0.3);
      display: flex; align-items: center; justify-content: center;
      text-decoration: none;
    }
    .fab:hover { background: #A33D00; }

    .empty { text-align: center; color: #A0704A; padding: 80px 16px; font-size: 16px; }
  </style>
</head>
<body>
  <header>
    <div class="header-inner">
      <a href="/index.html" class="logo">🍠 고구마마켓</a>
      <a href="/products/new" class="register-btn">상품 등록</a>
    </div>
  </header>

  <ul id="product-list">
    <li><a><div class="empty">불러오는 중...</div></a></li>
  </ul>

  <a href="/products/new" class="fab" aria-label="상품 등록">+</a>

  <script>
    const SUPABASE_URL = 'https://wenkiiedbtylxfknzevx.supabase.co'
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6IndlbmtpaWVkYnR5bHhma256ZXZ4Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzg0ODM2MTAsImV4cCI6MjA5NDA1OTYxMH0.-sfWSX88XU482zGgHjEYJtG1W072z2U-Wryg15he5bM'

    const { createClient } = supabase
    const client = createClient(SUPABASE_URL, SUPABASE_ANON_KEY)

    function formatPrice(price) {
      return '₩' + price.toLocaleString('ko-KR')
    }

    function formatDate(dateStr) {
      const diff = Math.floor((Date.now() - new Date(dateStr).getTime()) / 1000)
      if (diff < 60) return '방금 전'
      if (diff < 3600) return Math.floor(diff / 60) + '분 전'
      if (diff < 86400) return Math.floor(diff / 3600) + '시간 전'
      return Math.floor(diff / 86400) + '일 전'
    }

    async function loadProducts() {
      const list = document.getElementById('product-list')
      const { data, error } = await client
        .from('products')
        .select('id, title, price, image_url, seller_name, status, created_at')
        .order('created_at', { ascending: false })

      if (error || !data || data.length === 0) {
        list.innerHTML = '<li><div class="empty">등록된 상품이 없어요 🍠</div></li>'
        return
      }

      list.innerHTML = data.map(p => {
        const isSold = p.status === '판매완료'
        const badge = p.status === '예약중'
          ? '<span class="badge badge-reserved">예약중</span>'
          : p.status === '판매완료'
          ? '<span class="badge badge-sold">판매완료</span>'
          : ''
        const thumb = p.image_url
          ? `<img src="${p.image_url}" alt="${p.title}" />`
          : '<div class="thumb-empty">🍠</div>'

        return `
          <li>
            <a href="/products/${p.id}">
              <div class="thumb">${thumb}</div>
              <div class="info">
                <div>
                  <div class="title-row">
                    ${badge}
                    <span class="title ${isSold ? 'title-sold' : ''}">${p.title}</span>
                  </div>
                  <div class="meta">${p.seller_name} · ${formatDate(p.created_at)}</div>
                </div>
                <div class="price ${isSold ? 'price-sold' : ''}">${formatPrice(p.price)}</div>
              </div>
            </a>
          </li>
        `
      }).join('')
    }

    loadProducts()
  </script>
</body>
</html>
